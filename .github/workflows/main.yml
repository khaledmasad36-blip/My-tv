name: Daily Update
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install Requests
        run: pip install requests
      - name: Run Script
        run: python update.py
      - name: Save Result
        run: |
          git config --global user.name 'UpdateBot'
          git config --global user.email 'bot@update.com'
          git add playlist.m3u
          git commit -m "Update" || echo "No changes"
          git push
